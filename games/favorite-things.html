function choose(answers, student, category, item) {
  if(!Number.isInteger(student)||student<0||student>5||!valid(category,item)) throw new Error('Invalid choice');
  return answers.map((answer,i)=>i===student?{...answer,[category]:item}:answer);
}
const isStudentComplete = answer => !!answer&&categories.every(c=>valid(c.id,answer[c.id]));
const isComplete = answers => Array.isArray(answers)&&answers.length===6&&answers.every(isStudentComplete);
function restore(raw) {
  try {
    const parsed=JSON.parse(raw);

      return answer;
    });
  } catch {}
  return Array.from({length:6},emptyAnswer);

const $=id=>document.getElementById(id);
const key='nyam-food-game-v1';

try{answers=restore(localStorage.getItem(key));}catch{}
let screen=isComplete(answers)?'results':'numbers';
const drawings={

function art(item,cls='illustration'){return `<svg class="${cls}" viewBox="0 0 120 100" aria-hidden="true"><ellipse cx="60" cy="52" rx="54" ry="43" fill="${item.color}"/>${drawings[item.id]??extraArt[item.id]}</svg>`;}
function itemFor(category,id){return categories.find(c=>c.id===category).items.find(item=>item.id===id);}
function save(){try{localStorage.setItem(key,JSON.stringify(answers));}catch{}}
function say(text){$('announcement').textContent=text;if(sound&&'speechSynthesis'in window){speechSynthesis.cancel();const speech=new SpeechSynthesisUtterance(text);speech.lang='ko-KR';speech.rate=.85;speechSynthesis.speak(speech);}}
function pickedCount(answer){return categories.filter(c=>answer[c.id]).length;}
function startCategory(index){categoryIndex=index;selected=answers[student][categories[index].id];screen='choice';render(true);say(`${student+1}번 친구, ${categories[index].question}`);}
function render(focus=false){
  const count=answers.filter(isStudentComplete).length;
  $('count').textContent=count;$('progress-fill').style.width=`${count/6*100}%`;
  document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',count);
  $('progress-text').textContent=count===6?'모든 친구가 세 가지를 골랐어요!':count?`${count}명의 친구가 세 가지를 골랐어요`:'음식 · 장난감 · 사람을 하나씩 골라요';
  const activeStep=screen==='numbers'?1:screen==='choice'?2:3;
  [1,2,3].forEach(n=>{$(`step${n}`).classList.toggle('active',n===activeStep);if(n===activeStep)$(`step${n}`).setAttribute('aria-current','step');else $(`step${n}`).removeAttribute('aria-current');});
  if(screen==='numbers'){
    $('panel').innerHTML=`<div class="panel-heading"><h2 id="screen-title" tabindex="-1">나는 몇 번인가요?</h2><p>내 번호를 누르고, 좋아하는 세 가지를 골라요.</p></div><div class="student-grid">${answers.map((answer,i)=>{
      const complete=isStudentComplete(answer),picked=pickedCount(answer);
      return `<button class="student ${complete?'done':''}" data-student="${i}" aria-label="${i+1}번, ${complete?'선택 완료, 바꾸기':picked?`${picked}가지 선택, 이어 고르기`:'좋아하는 것 고르기'}"><span class="number">${i+1}<span style="font-size:.5em">번</span></span><span class="student-status">${complete?'세 가지 선택 완료 ✓':picked?`${picked} / 3 선택했어요`:'좋아하는 것 고르기'}</span>${picked?`<small>${categories.filter(c=>answer[c.id]).map(c=>c.name).join(' · ')}</small>`:'<small>음식 · 장난감 · 사람</small>'}</button>`;
    }).join('')}</div>${count===6?'<div class="panel-bottom"><button class="primary" id="show-results">모두의 선택 보기</button></div>':''}`;
  }else if(screen==='choice'){
    const category=categories[categoryIndex];
    $('panel').innerHTML=`<div class="category-nav" aria-label="고를 종류">${categories.map((c,i)=>`<button class="category-tab ${i===categoryIndex?'current':''}" data-category="${i}" ${i===categoryIndex?'aria-current="step"':''}><span>${i+1}</span> ${c.name}${answers[student][c.id]?' <span aria-label="선택 완료">✓</span>':''}</button>`).join('')}</div><div class="food-toolbar"><div class="panel-heading"><span class="heading-badge">${student+1}번 친구 · ${categoryIndex+1} / 3</span><h2 id="screen-title" tabindex="-1">${category.question}</h2><p>${category.id==='person'?'좋아하는 사람 한 명을 눌러 주세요.':'좋아하는 '+category.name+' 하나를 눌러 주세요.'}</p></div><button class="text-button" id="back">번호 다시 고르기</button></div><div class="food-grid">${category.items.map(item=>`<button class="food ${selected===item.id?'selected':''}" data-choice="${item.id}" aria-pressed="${selected===item.id}">${art(item)}<strong>${item.name}</strong><span class="check" aria-hidden="true">✓</span></button>`).join('')}</div><div class="panel-bottom"><span class="selection-hint" id="selection-hint">${selected?`${itemFor(category.id,selected).name}, 좋아요!`:'하나를 고르고 선택 버튼을 눌러요.'}</span><button class="primary" id="confirm" ${selected?'':'disabled'}>${category.id==='food'?'이 음식으로 선택':category.id==='toy'?'이 장난감으로 선택':'이 사람으로 선택'}</button></div>`;
  }else{
    $('panel').innerHTML=`<div class="panel-heading"><span class="success-mark" aria-hidden="true">✓</span><h2 id="screen-title" tabindex="-1">우리가 좋아하는 것들이에요!</h2><p>1번부터 6번까지, 음식 · 장난감 · 사람을 함께 봐요.</p></div><div class="results-grid">${answers.map((answer,i)=>`<article class="student-result"><h3>${i+1}번 친구</h3>${categories.map((c,index)=>{const item=itemFor(c.id,answer[c.id]);return `<div class="result-row">${art(item,'result-art')}<div><span class="result-label">좋아하는 ${c.name}</span><strong>${item.name}</strong></div><button class="result-change" data-student="${i}" data-edit="${index}" aria-label="${i+1}번 ${c.name} 바꾸기">바꾸기</button></div>`;}).join('')}</article>`).join('')}</div><div class="panel-bottom"><button class="secondary" id="back">번호 화면으로</button><button class="primary" id="print">결과 인쇄하기</button></div>`;
  }
  if(focus){$('screen-title').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
}
$('panel').addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  if(button.dataset.student!==undefined){student=Number(button.dataset.student);const missing=categories.findIndex(c=>!answers[student][c.id]);startCategory(button.dataset.edit!==undefined?Number(button.dataset.edit):missing<0?0:missing);}
  else if(button.dataset.category!==undefined){startCategory(Number(button.dataset.category));}
  else if(button.dataset.choice){selected=button.dataset.choice;document.querySelectorAll('[data-choice]').forEach(b=>{const match=b.dataset.choice===selected;b.classList.toggle('selected',match);b.setAttribute('aria-pressed',match);});$('confirm').disabled=false;const name=itemFor(categories[categoryIndex].id,selected).name;$('selection-hint').textContent=`${name}, 좋아요!`;say(name);}
  else if(button.id==='confirm'&&selected){
    const category=categories[categoryIndex];
    answers=choose(answers,student,category.id,selected);save();
    const name=itemFor(category.id,selected).name;
    const missing=categories.findIndex(c=>!answers[student][c.id]);
    if(missing>=0){startCategory(missing);say(`${name} 선택! ${categories[missing].question}`);}
    else{const number=student+1;screen=isComplete(answers)?'results':'numbers';student=null;selected=null;render(true);say(`${number}번 친구가 세 가지를 모두 골랐어요. ${screen==='results'?'모두의 선택을 함께 봐요.':'다음 친구의 번호를 골라 주세요.'}`);}
  }
  else if(button.id==='back'){screen='numbers';student=null;selected=null;render(true);}
  else if(button.id==='show-results'&&isComplete(answers)){screen='results';render(true);}
  else if(button.id==='print'){window.print();}
});
$('sound').addEventListener('click',()=>{sound=!sound;$('sound').setAttribute('aria-pressed',sound);$('sound').innerHTML=`<span aria-hidden="true">♫</span> 읽어주기 ${sound?'켜짐':'꺼짐'}`;if(sound)say('읽어주기를 켰어요.');else if('speechSynthesis'in window)speechSynthesis.cancel();});
if(!('speechSynthesis'in window)){$('sound').disabled=true;$('sound').textContent='읽어주기 미지원';}
$('reset').addEventListener('click',()=>$('reset-dialog').showModal());
$('cancel-reset').addEventListener('click',()=>$('reset-dialog').close());
$('confirm-reset').addEventListener('click',()=>{answers=restore(null);student=null;selected=null;screen='numbers';categoryIndex=0;save();$('reset-dialog').close();render(true);say('새로 시작해요. 내 번호를 골라 주세요.');});
render();

})();
</script>
