name: Verify Firestore Security Rules
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'tests/firestore.test.mjs', '.github/workflows/security-rules.yml', 'package.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts
      - run: npm run test:rules
